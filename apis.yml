aid: ensoma
name: Ensoma
description: 'Ensoma is a privately held, clinical-stage genomic medicines company developing
  in vivo hematopoietic stem cell (HSC) engineering. Its platform pairs an off-the-shelf
  in vivo delivery system built on high-capacity virus-like particles that preferentially
  bind HSCs with a gene engineering toolkit spanning base editing and high-efficiency
  gene integration, carrying payloads of roughly 35 kilobases so that changes from single-base
  edits through multi-gene insertions can be made without ex vivo cell collection, manipulation,
  or transplant conditioning. The company is pursuing programs across genetic disease,
  immune disorders, and oncology, including EN-374 for X-linked chronic granulomatous
  disease, and is backed by 5AM Ventures, F-Prime Capital, RTW Investments, Alexandria
  Venture Investments, Cormorant Asset Management, and the Bill & Melinda Gates Foundation.
  Enrichment found no public developer API, developer portal, SDK, OpenAPI/GraphQL/AsyncAPI
  contract, MCP server, or agent card — this is a therapeutics R&D company, not an API
  provider. Its only public machine-readable output is open-source computational genomics
  and sequencing-pipeline code published under its GitHub organization.'
